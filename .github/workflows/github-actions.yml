name: CI

on:
  push:
    branches: [ dev ]
  pull_request:

jobs:
  backend:
    name: Build & Test Go Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./go-image-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Download Dependencies
        run: go mod tidy

      - name: Run Tests
        run: go test -v ./...

      - name: Build Backend
        run: go build -o server .

